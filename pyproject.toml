[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "sweetviz",
  "sweetviz.fonts",
  "sweetviz.mpl_styles",
  "sweetviz.templates",
  "sweetviz.templates.js",
]

[tool.setuptools.package-data]
"sweetviz" = [
  "sweetviz_defaults.ini",
  "templates/*.html",
  "templates/*.css",
  "templates/js/*.js",
  "fonts/*.ttf",
  "fonts/*.ttc",
  "fonts/LICENSE*",
  "mpl_styles/*.mplstyle",
]

[tool.setuptools]
include-package-data = true

[project]
name = "sweetviz"
version = "2.3.3"
authors = [
  { name = "Francois Bertrand", email = "fb@fbdesignpro.com" },
]
description = "A pandas-based library to visualize and compare datasets."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.7"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
]
keywords=[
    "pandas",
    "data-science",
    "data-analysis",
    "python",
    "eda",
    "exploratory-data-analysis",
    "visualization",
]
dependencies = [
    'pandas>=0.25.3,!=1.0.0,!=1.0.1,!=1.0.2',
    'numpy>=1.16.0',
    'matplotlib>=3.1.3',
    'tqdm>=4.43.0',
    'scipy>=1.3.2',
    'jinja2>=2.11.1',
    'importlib_resources>=1.2.0;python_version<"3.9"',
    'importlib_metadata;python_version<"3.8"',
]

[project.optional-dependencies]
notebook = [
  "ipython>=5.0",
]
comet = [
  "comet_ml>=3.0.0",
]
all = [
  "sweetviz[notebook,comet]",
]
test = [
  "pytest >=6",
  "pytest-cov >=3",
]
dev = [
  "sweetviz[test,notebook,comet]",
  "build >=0.10",
  "twine >=4.0",
  "ruff >=0.1",
]
docs = [
  "sphinx>=4.0",
  "myst_parser>=0.13",
  "sphinx_book_theme>=0.1.0",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo",
]

[project.urls]
Homepage = "https://github.com/fbdesignpro/sweetviz"
"Bug Tracker" = "https://github.com/fbdesignpro/sweetviz/issues"
Discussions = "https://github.com/fbdesignpro/sweetviz/discussions"
Changelog = "https://github.com/fbdesignpro/sweetviz/releases"
Documentation = "https://github.com/fbdesignpro/sweetviz#readme"
