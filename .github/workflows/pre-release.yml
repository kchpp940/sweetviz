name: Pre-Release Quality Gate

on:
  push:
    branches: [main, master, gch*]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_KEY_PIP: pip-v1-${{ runner.os }}

jobs:
  # Tier 1 — Doc consistency (fast; no heavy dependencies)
  doc-consistency:
    name: Doc / notebook drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run doc_consistency gate
        run: |
          python tools/check.py doc_consistency

  # Tier 2 — End-to-end examples gate (render every report type)
  examples:
    name: Example runner · ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run examples gate (render every artefact)
        run: |
          python tools/check.py examples

      - name: Upload example outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            sweetviz_example_outputs/
          retention-days: 7

  # Tier 3 — Combined RELEASE gate (examples AND docs; single canonical status check)
  release:
    name: Release gate (examples AND docs)
    needs: [doc-consistency, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the RELEASE gate — every tier must pass
        id: release
        run: |
          python tools/check.py release

      - name: Upload full release-gate artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artefacts
          path: |
            sweetviz_example_outputs/
          retention-days: 30
